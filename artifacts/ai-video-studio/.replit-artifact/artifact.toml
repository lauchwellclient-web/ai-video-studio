kind = "web"
previewPath = "/"
title = "AI Video Studio"
description = "A focused AI video generation studio that turns a text prompt into a polished 15-second video concept, tracks generation progress, and keeps a history of created clips."
version = "1.0.0"
id = "artifacts/ai-video-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21370

[services.development]
run = "pnpm --filter @workspace/ai-video-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-video-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-video-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21370"
BASE_PATH = "/"
